<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta content="ie=edge" http-equiv="X-UA-Compatible"/>
  <title>
   Too many requests - Screener.in
  </title>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600" rel="stylesheet"/>
  <style>
   html {
      font-size: 62.5%;
    }

    body {
      text-align: center;
      padding: 10px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 2rem;
      font-weight: 300;
    }

    h1 {
      font-size: 2.074em;
      line-height: 1.2;
      letter-spacing: -.03em;
    }

    body {
      font-size: 1.5em;
      /* currently ems cause chrome bug misinterpreting rems on body element */
      line-height: 1.6;
      font-weight: 400;
      font-family: Open Sans, Segoe UI, sans-serif;
      color: #222;
    }

    article {
      display: block;
      text-align: left;
      max-width: 650px;
      margin: 0 auto;
      margin-top: 6rem;
    }

    @media (min-width: 550px) {
      article {
        margin-top: 15rem;
      }
    }

    p {
      font-size: 120%;
    }

    a {
      color: hsl(222, 96%, 50%);
      text-decoration: none;
    }

    a:hover {
      color: hsl(222, 100%, 48%);
    }
  </style>
 </head>
 <body>
  <article>
   <h1>
    Too many requests
   </h1>
   <p>
    Sorry, we're unable to process your requests this quickly.
   </p>
   <p>
    Please refresh the page after some time. Or
    <a href="mailto:support@screener.in">
     contact our support
    </a>
    if the problem persists.
   </p>
   <p>
    — Screener Team
   </p>
  </article>
 </body>
</html>
